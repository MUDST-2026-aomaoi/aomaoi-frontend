name: aomaoi

services:
  app:
    image: ghcr.io/mudst-2026-aomaoi/aomaoi-backend:latest
    container_name: aomaoi-app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-aomaoi_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-aomaoi_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-aomaoi_password}
      SPRING_LIQUIBASE_ENABLED: "false"
      APP_SEED_ENABLED: "false"
      E2E_SUPPORT_KEY: ${E2E_SUPPORT_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET of at least 32 bytes}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: aomaoi-postgres
    ports:
      - "${DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-aomaoi_db}
      POSTGRES_USER: ${DB_USER:-aomaoi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aomaoi_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ghcr.io/mudst-2026-aomaoi/aomaoi-backend:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-aomaoi_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-aomaoi_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-aomaoi_password}
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_CONTEXTS: demo
      APP_MIGRATION_JOB: "true"
      APP_SEED_ENABLED: "false"
      E2E_SUPPORT_KEY: ${E2E_SUPPORT_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET of at least 32 bytes}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8081/api
    container_name: aomaoi-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
    name: aomaoi_postgres_data
