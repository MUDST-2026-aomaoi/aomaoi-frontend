name: Frontend E2E Testing Pipeline

on:
  push:
    branches: [ "main", "dev", "integrate", "feat/e2e-pipeline" ]
  pull_request:
    branches: [ "main", "integrate" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  e2e:
    name: Cypress End-to-End Testing
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Checkout backend source used by the shared stack
      uses: actions/checkout@v4
      with:
        repository: mudst-2026-aomaoi/aomaoi-backend
        ref: main
        fetch-depth: 0
        path: backend-source

    - name: Use backend feat/phase-2 if not yet merged into main
      working-directory: backend-source
      run: |
        if git show-ref --verify --quiet refs/remotes/origin/feat/phase-2 && ! git merge-base --is-ancestor origin/feat/phase-2 origin/main; then
          git checkout feat/phase-2
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Test Cypress run lifecycle and cleanup retry
      run: npm run test:e2e-lifecycle

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure shared-system test support
      run: |
        echo "E2E_SUPPORT_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
        echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

    - name: Build backend image from matching branch
      run: docker build -t ghcr.io/mudst-2026-aomaoi/aomaoi-backend:latest ./backend-source

    - name: Start application stack
      run: |
        docker compose up --build -d
        for i in {1..60}; do
          if curl --fail --silent http://localhost:8081/actuator/health/readiness; then
            exit 0
          fi
          sleep 3
        done
        docker compose logs --tail 100 app migrate
        exit 1

    - name: Run Cypress E2E Tests
      uses: cypress-io/github-action@v6
      with:
        command: npm run cypress:run
        wait-on: 'http://localhost:3000'
        wait-on-timeout: 60
        record: false

    - name: Upload Cypress Screenshots (on failure)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots
        path: cypress/screenshots
        if-no-files-found: ignore

    - name: Upload Cypress Videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cypress-videos
        path: cypress/videos
        if-no-files-found: ignore

    - name: Tear Down Test Environment
      if: always()
      run: |
        docker compose down -v
