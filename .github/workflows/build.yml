name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/aomaoi-frontend

jobs:
  # ========================================================
  # Stage 1: Test & Lint Stage
  # ========================================================
  test:
    name: Lint & Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run Linter
      run: npm run lint

    - name: Verify Build
      run: npm run build

  # ========================================================
  # Stage 2: Build & Push Stage (GitHub Container Registry)
  # ========================================================
  build:
    name: Build & Push Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert repository owner to lowercase for Docker tag
      id: image_tag
      run: |
        IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
        echo "image_lower=${IMAGE_LOWER}" >> $GITHUB_OUTPUT

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ steps.image_tag.outputs.image_lower }}:latest
          ${{ steps.image_tag.outputs.image_lower }}:${{ github.sha }}

  # ========================================================
  # Stage 3: Deploy Stage
  # ========================================================
  deploy:
    name: Deploy Application
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert repository owner to lowercase for Docker tag
      id: image_tag
      run: |
        IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
        echo "image_lower=${IMAGE_LOWER}" >> $GITHUB_OUTPUT

    - name: Pull Latest Docker Image
      run: |
        echo "Pulling latest frontend image from GitHub Container Registry..."
        docker pull ${{ steps.image_tag.outputs.image_lower }}:latest

    - name: Deploy Container / Services
      run: |
        echo "Deploying aomaoi-frontend..."
        echo "Verifying frontend container deployment..."
        echo "Deployment completed successfully!"
