name: Frontend CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24' 
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      # This ensures the React/Vite code compiles successfully without syntax errors
      run: npm run build

    - name: Build Docker Image
      # This fulfills the requirement: Pipeline as Code to build docker on github
      run: docker build -t aomaoi-frontend:latest .
